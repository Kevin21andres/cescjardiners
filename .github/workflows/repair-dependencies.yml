name: One-shot dependency repair

on:
  push:
    branches: ["feat/web-quality-seo-accessibility-20261015"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: apply npm audit fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply nonbreaking security updates to lockfile
        run: npm audit fix --package-lock-only --omit=dev
      - name: Install updated dependencies
        run: npm ci
      - name: Ensure no high production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit reviewed lockfile changes to feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): resolve production security advisories"
            git push
          fi
