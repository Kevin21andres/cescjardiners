name: One-shot dependency lockfile cleanup
on:
  push:
    branches: ["feat/web-quality-seo-accessibility-20261015"]
permissions:
  contents: write
jobs:
  cleanup:
    if: "github.event.head_commit.message == 'chore: prune unused dependencies'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify lockfile compatibility
        run: npm ci
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): refresh lockfile after removing unused packages"
            git push
          fi
