name: One-shot Tailwind v4 migration lockfile
on:
  push:
    branches: ["feat/web-quality-seo-accessibility-20261015"]
permissions:
  contents: write
jobs:
  update:
    if: "github.event.head_commit.message == 'security: migrate Tailwind 4 toolchain'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with Tailwind v4
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify deterministic install
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Report remaining development-only advisories
        run: npm audit --audit-level=high || true
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
      - name: Build production website
        run: npm run build
      - name: Update lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): lock audited Tailwind 4 toolchain"
            git push
          fi
